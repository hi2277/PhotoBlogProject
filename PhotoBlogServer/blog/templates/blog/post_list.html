<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Photo Blog</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f5f6f8;
            color: #202635;
            font-family: Arial, sans-serif;
        }
        header {
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 24px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
        }
        h1 { margin: 0 0 12px; }
        nav { display: flex; gap: 20px; }
        a { color: #245bc0; }
        main { padding: 28px 24px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
        }
        article {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
        }
        article img {
            display: block;
            width: 100%;
            height: 260px;
            object-fit: contain;
            background: #eef0f3;
        }
        .content { padding: 20px; }
        h2 { margin: 0 0 12px; }
        .meta { color: #647084; font-size: 14px; }
        .text { overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Photo Blog</h1>
            <nav>
                <a href="{% url 'post_list' %}">Home</a>
                <a href="/api_root/Post/">REST API</a>
                <a href="/admin/">Administration</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <p>{{ posts|length }} photo posts</p>
        <div class="grid">
            {% for post in posts %}
                <article>
                    {% if post.image %}
                        <img src="{{ post.image.url }}" alt="{{ post.title }}">
                    {% endif %}
                    <div class="content">
                        <h2>{{ post.title }}</h2>
                        <p class="meta">
                            {{ post.author.username }} ·
                            {{ post.created_date|date:"Y-m-d H:i" }}
                        </p>
                        <div class="text">{{ post.text|linebreaks }}</div>
                    </div>
                </article>
            {% empty %}
                <p>No photos yet.</p>
            {% endfor %}
        </div>
    </main>
</body>
</html>
